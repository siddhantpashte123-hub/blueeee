<!-- ============================ AUTH ============================ -->
<div id="auth" class="auth-screen hidden">
  <div class="auth-glow auth-glow-a"></div>
  <div class="auth-glow auth-glow-b"></div>
  <div class="auth-inner">
    <div class="auth-brand">
      <span class="brand-mark"><svg class="ic"><use href="#i-box"/></svg></span>
      <div>
        <div class="brand-name">BotDeck</div>
        <div class="brand-sub">Docker-free bot hosting</div>
      </div>
    </div>
    <div class="auth-card" id="auth-card"></div>
    <div class="auth-foot">
      Runs directly on your VPS · no Docker, no containers
    </div>
  </div>
</div>

<!-- ============================= APP ============================ -->
<div id="app" class="app hidden">
  <div class="sidebar-backdrop" data-action="close-sidebar"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <a class="brand" href="#/overview">
        <span class="brand-mark"><svg class="ic"><use href="#i-box"/></svg></span>
        <span class="brand-text">
          <span class="brand-name" id="panel-name">BotDeck</span>
          <span class="brand-sub">Bot hosting panel</span>
        </span>
      </a>
    </div>

    <nav class="nav">
      <a class="nav-item" data-nav="overview" href="#/overview">
        <svg class="ic"><use href="#i-grid"/></svg><span>Overview</span>
      </a>
      <a class="nav-item" data-nav="bots" href="#/bots">
        <svg class="ic"><use href="#i-box"/></svg><span>All bots</span>
        <span class="nav-badge" id="nav-bot-count">0</span>
      </a>
      <a class="nav-item" data-nav="settings" href="#/settings">
        <svg class="ic"><use href="#i-settings"/></svg><span>Panel settings</span>
      </a>
    </nav>

    <div class="side-head">
      <span>Bots</span>
      <button class="icon-btn xs" data-action="new-bot" title="Create a bot">
        <svg class="ic"><use href="#i-plus"/></svg>
      </button>
    </div>
    <div class="side-bots" id="side-bots"></div>
    <div class="side-footer" id="side-footer"></div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-wrap"></div>
<input type="file" id="upload-input" multiple hidden>

<script src="/assets/app.js" defer></script>
</body>
</html>
